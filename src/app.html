<!doctype html>
<html lang="%paraglide.lang%">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="icon" href="/favicon.ico" sizes="32x32" />
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/manifest.webmanifest" />
        <!-- The name under the icon on iOS, which may otherwise take the page title -->
        <meta name="apple-mobile-web-app-title" content="Cellar" />
        <!-- The colour of the browser bar or of the installed app's title bar: the header's, set
             by applyTheme for the mode chosen in the preferences, not only the system's. -->
        <meta name="theme-color" content="#ffffff" />
        <script>
            // The app applies the theme once it has loaded: until then, a dark mode user would see
            // a white page. This applies the dark mode of the preferences (preferences.svelte.ts)
            // and the colours that applyTheme (theme-colors.ts) last set, when made for that mode.
            try {
                var mode = localStorage.getItem('wine-cellar-theme-mode');
                var dark =
                    mode === 'dark' ||
                    (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
                var root = document.documentElement;
                root.classList.toggle('dark', dark);
                var cache = JSON.parse(localStorage.getItem('wine-cellar-theme-colors'));
                if (cache && cache.dark === dark) {
                    for (var name in cache.variables) {
                        root.style.setProperty('--' + name, cache.variables[name]);
                    }
                    document
                        .querySelector('meta[name="theme-color"]')
                        .setAttribute('content', cache.variables.card);
                }
            } catch (error) {
                // Without storage, the app applies the theme once it has loaded.
            }
        </script>
        %sveltekit.head%
    </head>
    <body data-sveltekit-preload-data="hover">
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
