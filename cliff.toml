# git-cliff renders the "Changes" section of each version for scripts/release.mjs,
# which adds the heading, the summary and the upgrade actions around it.

[changelog]
body = """
{% for group, commits in commits | group_by(attribute="group") %}
#### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message | split(pat="\n") | first | trim | upper_first }} ({{ commit.id | truncate(length=7, end="") }})\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
# Keep commits that do not follow Conventional Commits, under "Other changes".
filter_unconventional = false
# Only final versions delimit a changelog section: an rc covers everything since the previous final version.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"
# The first matching parser wins; the HTML comments only order the groups.
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^docs\\(roadmap\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^(build|ci)", group = "<!-- 5 -->Build and CI" },
  { message = ".*", group = "<!-- 6 -->Other changes" },
]
