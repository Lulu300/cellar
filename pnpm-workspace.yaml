# pnpm settings (no workspace packages: this file only holds configuration).
# Only install versions published at least 7 days ago, to let malicious releases
# get caught and unpublished first. For an urgent security fix, add the package
# to minimumReleaseAgeExclude temporarily.
minimumReleaseAge: 10080
# The packages allowed to run install scripts (true) or skipped silently (false): pnpm stops the
# install on any other package that has one.
allowBuilds:
  # Checks its native binary, which the build and the tests use
  esbuild: true
  # jsPDF's optional polyfills, which the server never loads: the script only prints a message
  core-js: false
# Refuse a Node.js that "engines" in package.json does not accept
engineStrict: true
